# Publishes n8n-nodes-empiriolabs to npm when a version tag such as 0.1.0 is pushed.
#
# n8n requires community nodes submitted for verification to be published from
# GitHub Actions with an npm provenance statement (from May 1 2026). The publish
# job asks GitHub for an OIDC token (id-token: write) and publishes with
# --provenance, so every version carries provenance that ties it to this
# repository, this workflow, and the tagged commit.
#
# npm authenticates through trusted publishing only (OIDC, no secret). On
# npmjs.com the package's trusted publisher is:
#   Organization or user: EmpirioLabs-AI
#   Repository:           n8n-nodes-empiriolabs
#   Workflow filename:    publish.yml
#   Environment:          (empty)
# Trusted publishing needs npm 11.5.1 or later, which Node 24 includes.
#
# Two jobs, so nothing installed for the build can publish: `build` lints,
# tests, builds and packs with a read-only token; `publish` runs in the
# approval-gated `npm` environment and only publishes that tarball.
#
# The tag must equal the version in package.json. `npm run release` on a local
# machine bumps the version, updates the changelog, and pushes the tag.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test, build and pack
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests, lint and build
        # The order of the earlier release flow: the tests build, then lint, then build.
        run: |
          npm test
          npm run lint
          npm run build

      - name: Pack
        id: pack
        run: |
          tarball="$(npm pack --silent --ignore-scripts)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          tar -tzf "$tarball"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tgz
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Lets npm request an OIDC token for trusted publishing and the provenance signature.
      id-token: write
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the npm version
        run: |
          npm_version="$(npm --version)"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$npm_version"; then
            echo "::error::npm $npm_version is too old for trusted publishing; 11.5.1 or later is required"
            exit 1
          fi

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tgz

      - name: Publish with provenance
        run: npm publish "./$TARBALL" --access public --provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
